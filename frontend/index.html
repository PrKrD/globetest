<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Grid Viewer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="app">
      <div id="cesiumContainer"></div>
      <div id="tooltip" class="tooltip hidden"></div>
      <div id="layerLegend" class="layer-legend hidden" aria-live="polite"></div>
      <section class="layer-controls" aria-label="Ocean data layer controls">
        <label class="control-row control-master"><span>Geostrophic subduction</span><input id="subductionToggle" type="checkbox" role="switch" /></label>
        <label class="control-row control-subordinate"><span>Use experimental equator</span><input id="subductionEquatorialToggle" type="checkbox" role="switch" checked /></label>
        <label class="control-row control-master control-product"><span>Maximum MLD (H)</span><input id="mldToggle" type="checkbox" role="switch" checked /></label>
        <label class="control-row control-master control-product"><span>Geostrophic velocity</span><input id="velocityToggle" type="checkbox" role="switch" /></label>
        <label class="control-row control-subordinate"><span>Use experimental equator</span><input id="equatorialToggle" type="checkbox" role="switch" checked /></label>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
